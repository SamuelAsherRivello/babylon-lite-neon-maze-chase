name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Check TypeScript source coverage
        run: npm run check:typescript-source
      - name: Check strict TypeScript
        run: npm run typecheck
      - name: Test template
        run: npm test
      - name: Build template
        run: npm run build
      - name: Bump patch version
        id: version
        shell: bash
        run: |
          current="$(cut -d= -f2 version.txt)"
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          printf 'version=%s\n' "$next" > version.txt
          echo "value=$next" >> "$GITHUB_OUTPUT"
      - name: Commit and tag release
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "chore: release v$VERSION"
          git tag "v$VERSION"
          git push origin HEAD:main --tags
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: gh release create "v$VERSION" --generate-notes --title "v$VERSION"
